name: Zigbee2MQTT ESP32
version: "1.0.0"
slug: zigbee2mqtt_esp32
description: Zigbee2MQTT with ESP32-C6 ZBOSS coordinator support and NVRAM backup
url: "https://github.com/tostmann/esp-coordinator"
arch:
  - aarch64
  - amd64
init: false
startup: services
boot: auto
map:
  - addon_config:rw
  - share:rw
ports:
  "8080/tcp": 8080
ports_description:
  "8080/tcp": "Zigbee2MQTT web UI"
options:
  mqtt_server: "mqtt://core-mosquitto"
  mqtt_user: ""
  mqtt_password: ""
  serial_port: "/dev/ttyACM0"
  zigbee_channel: 11
  transmit_power: 20
schema:
  mqtt_server: str
  mqtt_user: str
  mqtt_password: password
  serial_port: str
  zigbee_channel: int
  transmit_power: int
environment:
  ZIGBEE2MQTT_DATA: "/config"
privileged: true
devices:
  - /dev/ttyACM0
  - /dev/serial/by-id/
