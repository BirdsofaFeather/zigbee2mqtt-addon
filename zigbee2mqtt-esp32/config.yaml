name: Zigbee2MQTT (ESP32-C6 Custom)
version: "0.1.0"          # ← now just a label; HA no longer uses it as a pull tag
slug: zigbee2mqtt_esp32
description: Custom tostmann Zigbee2MQTT fork with ESP32-C6 coordinator support
url: https://github.com/tostmann/esp-coordinator

# NO image: line — HA builds locally from the Dockerfile instead

arch:
  - amd64
  - aarch64
  - armv7

ports:
  8080/tcp: 8080
ports_description:
  8080/tcp: Zigbee2MQTT web frontend

uart: true
udev: true
devices:
  - /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_A0:F2:62:86:45:98-if00

map:
  - addon_config:rw

options:
  serial_port: /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_A0:F2:62:86:45:98-if00
  mqtt_server: mqtt://core-mosquitto:1883
  timezone: Europe/Berlin
schema:
  serial_port: str
  mqtt_server: str
  timezone: str
